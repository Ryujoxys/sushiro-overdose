[project]
name = "sushiro-mcp"
version = "0.1.0"
description = "寿司郎本机排队数据查询与到店建议，不代替用户取号"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
sushiro-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
