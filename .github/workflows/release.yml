name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v4.0 or v4.0.1'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-loader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Verify native Windows executable can start
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') { throw 'Invalid release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          $exe = Join-Path $env:RUNNER_TEMP 'sushiro-native.exe'
          $output = Join-Path $env:RUNNER_TEMP 'sushiro-version.txt'
          go build -tags desktop,production,wv2runtime.browser -ldflags "-s -w -H windowsgui -X main.Version=$version" -o $exe .
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          # Version exits before opening windows, reading credentials or sending notifications.
          $process = Start-Process -FilePath $exe -ArgumentList 'version' -Wait -PassThru -RedirectStandardOutput $output
          if ($process.ExitCode -ne 0) { throw "Windows loader failed: $($process.ExitCode)" }
          $text = Get-Content $output -Raw -Encoding utf8
          if (-not $text.Contains("v$version")) { throw "Unexpected version: $text" }
          Write-Output $text

  goreleaser:
    needs: windows-loader
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Expected a stable release tag, such as v4.0 or v4.0.1: $TAG"
            exit 1
          fi
          NOTES="docs/release-notes-${TAG#v}.md"
          test -s "$NOTES"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Run vet
        run: go vet ./...

      - name: Check gofmt
        shell: bash
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files need gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Check go mod tidy
        shell: bash
        run: |
          go mod tidy
          CHANGES="$(git status --porcelain -- go.mod go.sum)"
          if [ -n "$CHANGES" ]; then
            echo "go mod tidy produced changes:"
            echo "$CHANGES"
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Check shell syntax
        run: bash -n install/install.sh scripts/bundle-macos.sh scripts/gen-windows-resources.sh scripts/build-desktop.sh

      - name: Verify Windows PE resources (SxS-safe manifest)
        run: go test ./internal/app/ -count=1 -run TestWindowsResourceSysoHasCleanManifest

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: 'v2.18.2'
          args: release --clean --release-notes ${{ steps.release.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.release.outputs.tag }}

      - name: Bundle macOS .app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          bash scripts/build-desktop.sh "$VERSION" dist
          BINARY="dist/native/sushiro"
          lipo "$BINARY" -verify_arch x86_64 arm64
          chmod +x scripts/bundle-macos.sh
          ./scripts/bundle-macos.sh "$BINARY" "$VERSION" dist/

      - name: Upload macOS DMG to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "${{ steps.release.outputs.tag }}" \
            "dist/Sushiro-Overdose-${VERSION}-macOS.dmg" \
            --clobber

      - name: Upload click-to-run Windows executables
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          # Native EXEs were built with the DMG. Keep the SxS-safe root resources.
          if ! ls dist/direct/*.exe >/dev/null 2>&1; then
            echo "No Windows executables found in dist/"
            find dist -maxdepth 3 -type f | sort
            exit 1
          fi
          # Basic size sanity — empty/truncated PE has caused odd loader errors.
          for f in dist/direct/*.exe; do
            bytes=$(wc -c <"$f" | tr -d ' ')
            echo "$f size=$bytes"
            if [ "$bytes" -lt 1000000 ]; then
              echo "Windows exe looks too small: $f ($bytes bytes)" >&2
              exit 1
            fi
          done
          gh release upload "${{ steps.release.outputs.tag }}" dist/direct/*.exe --clobber

      - name: Check all artifacts and publish the completed release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          # Keep the release in draft until the DMG and both click-to-run EXEs exist.
          EXPECTED=(
            "sushiro-overdose_${RELEASE_VERSION}_darwin_all.tar.gz"
            "sushiro-overdose_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "sushiro-overdose_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "sushiro-overdose_${RELEASE_VERSION}_windows_amd64.zip"
            "sushiro-overdose_${RELEASE_VERSION}_windows_arm64.zip"
            "Sushiro-Overdose-${RELEASE_VERSION}-macOS.dmg"
            "Sushiro-Overdose-${RELEASE_VERSION}-windows-amd64.exe"
            "Sushiro-Overdose-${RELEASE_VERSION}-windows-arm64.exe"
          )
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for name in "${EXPECTED[@]}"; do
            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$name"; then
              echo "Missing release asset: $name" >&2
              exit 1
            fi
          done
          (
            cd dist
            shasum -a 256 *.tar.gz *.zip *.dmg > checksums.txt
            cd direct
            shasum -a 256 *.exe >> ../checksums.txt
          )
          test "$(wc -l < dist/checksums.txt | tr -d ' ')" = 8
          gh release upload "$RELEASE_TAG" dist/checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "$RELEASE_TAG · lite正式版" --notes-file "$RELEASE_NOTES"
